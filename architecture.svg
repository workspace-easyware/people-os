<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#111827">일잇 People OS — Cloudflare 아키텍처 (Workers 프로토타입)</text>
  <text x="40" y="76" font-size="14" fill="#6b7280">실선 = MVP 구현됨 (라이브 검증 완료) · 점선 = 설계·스텁 / 보강 예정 · 로컬에서는 Workers AI·Vectorize가 폴백으로 동작</text>

  <!-- User -->
  <rect x="40" y="110" width="220" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="140" font-size="16" font-weight="700" text-anchor="middle" fill="#1e40af">사용자</text>
  <text x="150" y="164" font-size="13" text-anchor="middle" fill="#374151">HR 실무자 · 코치</text>
  <text x="150" y="182" font-size="13" text-anchor="middle" fill="#374151">브라우저</text>

  <!-- Workers -->
  <rect x="360" y="110" width="300" height="100" rx="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="510" y="140" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Workers (Hono)</text>
  <text x="510" y="164" font-size="13" text-anchor="middle" fill="#fff7ed">src/index.ts · API + 프론트 서빙</text>
  <text x="510" y="184" font-size="13" text-anchor="middle" fill="#fff7ed">public/index.html · 6개 탭 + 사이드바</text>

  <!-- Arrow user -> workers -->
  <line x1="260" y1="150" x2="360" y2="150" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="140" font-size="12" text-anchor="middle" fill="#374151">HTTPS</text>

  <!-- Row 2: core storage -->
  <g font-size="13">
    <rect x="40" y="270" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="140" y="300" font-size="15" font-weight="700" text-anchor="middle">D1</text>
    <text x="140" y="322" text-anchor="middle">문서·규정·세션</text>
    <text x="140" y="340" text-anchor="middle">리플렉션·지식 공백</text>

    <rect x="270" y="270" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="370" y="300" font-size="15" font-weight="700" text-anchor="middle">R2</text>
    <text x="370" y="322" text-anchor="middle">음성·문서 원본</text>
    <text x="370" y="340" text-anchor="middle">추출본 저장</text>

    <rect x="500" y="270" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="300" font-size="15" font-weight="700" text-anchor="middle">KV</text>
    <text x="600" y="322" text-anchor="middle">질문 캐시</text>
    <text x="600" y="340" text-anchor="middle">ask:{session}:{q}</text>

    <rect x="730" y="270" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="830" y="300" font-size="15" font-weight="700" text-anchor="middle">Durable Objects</text>
    <text x="830" y="322" text-anchor="middle">AgentSession</text>
    <text x="830" y="340" text-anchor="middle">대화 기억</text>

    <rect x="960" y="270" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1060" y="300" font-size="15" font-weight="700" text-anchor="middle">Workers AI</text>
    <text x="1060" y="322" text-anchor="middle">전사·요약·답변</text>
    <text x="1060" y="340" text-anchor="middle">임베딩·리플렉션</text>
  </g>

  <!-- Row 3 -->
  <g font-size="13">
    <rect x="40" y="410" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="140" y="440" font-size="15" font-weight="700" text-anchor="middle">Vectorize</text>
    <text x="140" y="462" text-anchor="middle">규정·문서 RAG</text>
    <text x="140" y="480" text-anchor="middle">bge-m3 · 라이브 동작</text>

    <rect x="270" y="410" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="370" y="440" font-size="15" font-weight="700" text-anchor="middle">Queues</text>
    <text x="370" y="462" text-anchor="middle">전사→요약→색인</text>
    <text x="370" y="480" text-anchor="middle">파이프라인 + DLQ</text>

    <rect x="500" y="410" width="200" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="600" y="440" font-size="15" font-weight="700" text-anchor="middle">AI Gateway</text>
    <text x="600" y="462" text-anchor="middle">캐시·레이트 리밋·로그</text>
    <text x="600" y="480" text-anchor="middle">S2 — 게이트웨이 생성 대기</text>

    <rect x="730" y="410" width="200" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="830" y="440" font-size="15" font-weight="700" text-anchor="middle">Hyperdrive</text>
    <text x="830" y="462" text-anchor="middle">기존 HR Postgres</text>
    <text x="830" y="480" text-anchor="middle">연결 (모의)</text>

    <rect x="960" y="410" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="1060" y="440" font-size="15" font-weight="700" text-anchor="middle">Cron · Turnstile</text>
    <text x="1060" y="462" text-anchor="middle">아침 다이제스트 07:00</text>
    <text x="1060" y="480" text-anchor="middle">스팸 방지 (fail-open)</text>
  </g>

  <!-- Flow -->
  <text x="40" y="560" font-size="16" font-weight="700" fill="#111827">데모 흐름 (3분)</text>
  <text x="40" y="588" font-size="14" fill="#374151">1. 음성 업로드 → Queues 파이프라인 (전사→요약→색인) · 2. “연차 3일?” → RAG 근거 답변 + 세션 기억</text>
  <text x="40" y="612" font-size="14" fill="#374151">3. 근거 없음 → 암묵지 게시 → 재질문은 암묵지 출처로 답변 · 4. 코칭 리플렉션 · 5. PPTX 초안 (개요 편집 후 생성)</text>
  <text x="40" y="652" font-size="13" fill="#6b7280">검증: 라이브 배포 — Chrome 확인 통과 (S1/S3/C5/C5-b/C7) · VERIFICATION.md 참조 · S2는 게이트웨이 생성 후 라이브 확인 예정</text>
  <text x="40" y="676" font-size="13" fill="#6b7280">제출 조건: Workers + D1·KV·R2·DO·Queues + Workers AI·Vectorize·AI Gateway·Cron · Workers판 프로토타입</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1500" width="760" height="1500" role="img" aria-labelledby="arch-title arch-desc" lang="ko">
  <title id="arch-title">People OS 아키텍처 — 진입점은 넷, 서버는 Worker 둘</title>
  <desc id="arch-desc">4층 구조. 1층 들어오는 길: 브라우저(HR 담당자·코치·코칭 대상)는 HTTPS로 fetch에, 외부 메일은 Email Routing(peopleos.site catch-all)을 거쳐 email에, 시간은 Cron Triggers(07:00·03:00·15분마다 KST)를 거쳐 scheduled에 들어온다. 질문 폼은 Turnstile로 봇을 확인한다(라이브 동작). 2층: 이 화살표가 모두 본체 Worker(people-os)로 모인다. 진입점은 fetch(Hono API와 화면·웹훅), email, scheduled, queue 네 개이고, 모듈은 인증·역할, 문서·전사, 질문(RAG), 코칭, 메일함, 관측·평가, 결재, 강의실, 워크플로우, 에이전트(Think), 채팅, 문서 편집이다. 서비스 바인딩으로 편집 Worker(people-os-doc-editor, PPTX·XLSX·DOCX 편집, RPC 전용)가 붙는다. Worker는 Queues 3개(people-os-pipeline, people-os-docx-jobs, people-os-doc-jobs, 재시도 3회 후 DLQ)에 메시지를 보내고 queue 진입점으로 다시 받는다. 메일 발송은 Cloudflare 밖의 Resend API를 HTTP로 부른다. 3층 AI: 모든 AI 호출은 AI Gateway(people-os, 용도 태그·캐시·로그)를 지나 Workers AI(Whisper, bge-m3, Qwen3.8-27b, toMarkdown, Clef, Llama 4 Scout)로 간다. 4층 데이터: Worker가 바인딩으로 D1(people-os-db), R2(people-os-files), KV(CACHE), Vectorize(people-os-index-m3), Durable Objects 8종(AgentSession·WorkflowAgent·ThinkAgent·AssistantAgent·ChatRoom·NotificationHub·RateLimiter·DocJobRunner)을 바로 쓴다. 녹음 한 건의 길: ① 업로드(fetch) ② R2에 원본 저장 ③ Whisper 구간 전사 ④ Queues로 넘김 ⑤ 요약·임베딩 ⑥ D1·Vectorize 저장. 실선은 라이브에서 확인한 연결, 점선은 코드는 있지만 라이브 확인 전인 연결, 회색 점선 상자는 Cloudflare 밖이다. 2026-11-23 코드 기준.</desc>


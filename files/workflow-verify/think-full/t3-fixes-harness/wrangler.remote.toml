# Think T3 고침 원격 시험 Worker (2026-11-21). 실제 Qwen(어시스턴트·조사 자식·워크플로 agent) + 실제 ask-pipeline.
#  /h/real     어시스턴트 실제 턴: 토큰 스트리밍(delta)·한국어 판단 근거·조사 자식 stop·조사 진행 이벤트
#  /h/real-wf  워크플로 agent(ThinkAgent) 1단계: 한국어 판단 근거 — 결과 전달은 건너뛴다 (REMOTE=1, 큐 없음 → 운영 workflow_agent_steps를 건드리지 않음)
# 배포: cf-wrangler.py deploy --config files/workflow-verify/think-full/t3-fixes-harness/wrangler.remote.toml
# 주의: ask_rag가 운영 D1·R2에 질문 트레이스를 남긴다 (세션 id 접두어 wf_asst_u_t3fx / wf_research_u_t3fx / wf_wr_t3fx). 시험 뒤 이 Worker는 지운다.
# 시험 창 OPEN_UNTIL(ms) 이후에는 403. /h/session·/h/eng/*(로컬 전용)은 원격에서 쓰지 않는다 (큐 바인딩 없음).
name = "people-os-t3-fixes-harness"
main = "harness.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat", "enable_ctx_exports"]
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "people-os-db"
database_id = "5dff997a-fe7b-4f27-9624-1c88e40857c1"

[[kv_namespaces]]
binding = "CACHE"
id = "de4c7ddf4c76495381ba82c56fb23dbb"

[[r2_buckets]]
binding = "FILES"
bucket_name = "people-os-files"

[[vectorize]]
binding = "VECTOR"
index_name = "people-os-index-m3"

[[durable_objects.bindings]]
name = "ASSISTANT_AGENT"
class_name = "FixAssistantAgent"

[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

[[durable_objects.bindings]]
name = "ThinkAgent"
class_name = "FixThinkAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FixAssistantAgent", "AgentSession", "FixThinkAgent"]

[vars]
OPEN_UNTIL = "1795251600000" # 11-21 18:00 KST
REMOTE = "1"

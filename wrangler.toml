# 일잇 People OS — wrangler 설정. 배포는 ~/workspace/custom-connectors/custom.cloudflare/bin/cf-wrangler.py deploy 로 (저장된 API 토큰 주입).
name = "people-os"
main = "src/index.ts"
compatibility_date = "2025-07-18"
# Think T3 (2026-11-20): enable_ctx_exports 추가 — 하위 에이전트(facet, src/assistant/research.ts)가 ctx.exports로 자식 클래스를 찾는다.
# compatibility_date는 올리지 않는다. 2025-07-18 + nodejs_compat만으로는 ctx.exports가 없어 subAgent()가 실패하고, 이 플래그를 더하면 된다 (people-os-t3-probe로 확인).
compatibility_flags = ["nodejs_compat", "enable_ctx_exports"]

# 대표 주소 peopleos.site는 이미 Worker에 커스텀 도메인으로 연결됨 (2026-11-17, v6135db73).
# wrangler.toml의 routes 항목은 토큰 권한 문제로 배포가 실패해서 제거함.
# 커스텀 도메인은 Worker에 독립적으로 유지되므로 routes 없이도 계속 열린다.
# workers.dev는 기본 주소로 그대로 유지된다.

# Workers Logs (전체 점검 2026-11-18): console.log / console.error와 호출 기록을 Cloudflare가 저장한다.
# 대시보드 → Workers & Pages → people-os → Logs 에서 검색한다 (예: event = "ask.complete").
# 기존 D1 + R2 트레이스(관측 탭)를 대체하지 않는 보완용이다. 구조화 로그 규칙은 src/obs/log.ts 참조
# (질문·답변 같은 내용은 싣지 않고 식별자·상태·숫자만 남긴다). 끄려면 enabled = false 로 바꾸고 다시 배포한다.
[observability]
enabled = true
head_sampling_rate = 1

# Think T3 (2026-11-20, 계획 2.1 H): Workers 추적(트레이스). 대시보드 Observability/Agents 화면에 요청·DO·하위 요청 스팬이 보인다.
# 기존 D1 + R2 트레이스(관측 탭)는 그대로 둔다. 끄려면 enabled = false 로 바꾸고 다시 배포한다.
[observability.traces]
enabled = true
head_sampling_rate = 1

# 정적 프론트 (public/)
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "people-os-db"
database_id = "5dff997a-fe7b-4f27-9624-1c88e40857c1"
preview_database_id = "36113f26-d305-4bef-963e-92f60a7d0a02" # wrangler dev --remote용 미리보기 DB (배포에는 영향 없음)
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "de4c7ddf4c76495381ba82c56fb23dbb"
preview_id = "b6247fcf1ee2467cbeea51190a0d0413" # wrangler dev --remote용 미리보기 네임스페이스 (배포에는 영향 없음)

[[r2_buckets]]
binding = "FILES"
bucket_name = "people-os-files"
preview_bucket_name = "people-os-dev-preview" # wrangler dev --remote용 미리보기 버킷 (배포에는 영향 없음)

[[vectorize]]
binding = "VECTOR"
index_name = "people-os-index-m3"

[ai]
binding = "AI"

# 문서 편집 (PPTX·XLSX, 2026-11-21): 별도 Worker people-os-doc-editor(폴더 pptx-editor/)로 가는 서비스 바인딩. RPC inspect/applyOps/replaceText + XLSX RPC.
# 2026-11-22: people-os-pptx-editor / PPTX_EDITOR → people-os-doc-editor / DOC_EDITOR로 개명.
# ooxml-core 번들(+9.2 MiB)과 편집 CPU(1회 ≈ 1초)를 본체에서 떼려고 나눴다 (PILOT-RESULT.md 조건 1). 편집 Worker를 먼저 배포해야 한다.
[[services]]
binding = "DOC_EDITOR"
service = "people-os-doc-editor"

[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

# WF-6 에이전트 루프 DO (인스턴스 1개 = run 1개의 agent 단계 1개). v2 태그는 D-2 배포 때 원격 적용된다.
[[durable_objects.bindings]]
name = "WORKFLOW_AGENT"
class_name = "WorkflowAgent"

# DO-1a 채팅방 DO. 바인딩만 — v3 마이그레이션 태그([ChatRoom, NotificationHub, RateLimiter])는 DO-MIG에서 한 번에 추가한다. 그 전에는 deploy 금지.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# DO-2 알림 허브 DO. 바인딩만 — v3 마이그레이션 태그는 DO-MIG에서 한 번에 추가한다. 그 전에는 deploy 금지.
[[durable_objects.bindings]]
name = "NOTIFICATION_HUB"
class_name = "NotificationHub"

# DO-3 질문 레이트 리미터 DO. 바인딩만 — v3 마이그레이션 태그는 DO-MIG에서 한 번에 추가한다. 그 전에는 deploy 금지.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkflowAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatRoom", "NotificationHub", "RateLimiter"]

# Think T1 (2026-11-20): agent 단계의 Think 런타임 DO. 인스턴스 1개 = run 1개의 agent 단계 1개 (이름 think:<runId>:<stepIndex>).
# 바인딩 이름은 T0 게이트와 같게 클래스 이름 그대로 둔다. 어느 런타임을 쓸지는 [vars] AGENT_RUNTIME이 정한다.
# v4를 배포한 뒤에는 wrangler rollback으로 그 이전 버전에 돌아갈 수 없다 — 롤백은 AGENT_RUNTIME="legacy" 재배포로 한다 (계획 R2).
[[durable_objects.bindings]]
name = "ThinkAgent"
class_name = "ThinkAgent"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ThinkAgent"]

# Think T2 (2026-11-20): 사용자당 어시스턴트 DO (이름 assistant:<userId>). 워크플로 agent 단계(ThinkAgent)와 클래스를 나눠 상태가 섞이지 않게 한다.
# /api/agents/* 라우트가 세션 인증 뒤 RPC로만 부른다 (routeAgentRequest로 바깥에 열지 않는다).
[[durable_objects.bindings]]
name = "ASSISTANT_AGENT"
class_name = "AssistantAgent"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AssistantAgent"]

# Word AI 지시 작업 실행기 DO (2026-11-22, src/docx/job-runner.ts). 인스턴스 1개 = 작업 1개 (idFromName(작업 id)).
# Queue 소비자가 작업을 여기로 넘기고 바로 ack하면, 실제 일(Qwen 호출 1~5분)은 이 DO의 알람(실행 한도 15분)에서 돈다.
# Queues는 배치가 끝난 뒤에만 소비자 수를 늘릴지 보기 때문에, 소비자가 직접 돌리면 작업이 한 번에 하나씩만 돈다 — 그 직렬 실행을 푼다.
# v6을 배포한 뒤에는 wrangler rollback으로 그 이전 버전에 돌아갈 수 없다. 되돌리려면 src/index.ts queue()의 handOffDocxJob 호출을 빼고 재배포한다 (클래스·바인딩은 남겨 둔다).
[[durable_objects.bindings]]
name = "DOC_JOB_RUNNER"
class_name = "DocJobRunner"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["DocJobRunner"]

# S1 Queues 파이프라인 (전사 완료 → 요약 → 색인)
# 큐 자체는 대시보드/부모가 만든다 (`wrangler queues create`는 이 단계에서
# 실행하지 않음 — 배포 전 `wrangler queues create people-os-pipeline` +
# `wrangler queues create people-os-pipeline-dlq` 필요).
# 소비자는 이 Worker의 queue() 핸들러. 실패한 메시지는 3회 재시도 후 DLQ로 간다.
[[queues.producers]]
binding = "PIPELINE"
queue = "people-os-pipeline"

[[queues.consumers]]
queue = "people-os-pipeline"
max_retries = 3
dead_letter_queue = "people-os-pipeline-dlq"

# Word AI 지시 작업 전용 큐 (2026-11-22, src/docx/jobs.ts). people-os-pipeline을 같이 쓰지 않는 이유: 작업 1개가 Qwen 응답을 1~5분 기다리는데,
# 라이브에서 같은 큐에 넣어 보니 앞 작업이 끝날 때까지 뒤 메시지가 26초 대기했다 (소비자 동시 실행이 바로 늘지 않는다) —
# 같은 큐를 쓰면 전사 파이프라인·워크플로우 단계가 그만큼 밀린다. 그래서 큐를 나누고 배치를 1개씩으로 한다.
# 재시도: 일시적인 AI 실패는 코드가 지연 재전달로 다시 시도하고(작업당 3회), max_retries는 소비자가 죽었을 때의 재전달용이다. DLQ는 파이프라인과 같이 쓴다.
# 큐는 `cf-wrangler.py queues create people-os-docx-jobs`로 만들었다 (2026-11-22).
[[queues.producers]]
binding = "DOCX_JOBS"
queue = "people-os-docx-jobs"

[[queues.consumers]]
queue = "people-os-docx-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "people-os-pipeline-dlq"

# 큰 파일 문서 작업 전용 큐 (2026-11-22, src/doc-jobs.ts): 예상 CPU가 2초 이상인 구조화 편집(PPTX·XLSX·DOCX ops)·Word 생성(이미지 많은 정의)을 맡는다.
# people-os-docx-jobs와 또 나눈 이유: Queues는 배치가 끝난 뒤에만 소비자 수를 늘릴지 본다 (배치를 처리하는 동안에는 늘리지 않는다 — 공식 문서 consumer-concurrency).
# AI 지시 작업은 1개가 1~5분이라 그동안 뒤 메시지가 기다리는데, 몇 초면 끝나는 CPU 작업이 그 뒤에 줄 서지 않게 한다.
# 편집 CPU는 편집 Worker(DOC_EDITOR RPC)에서 쓰이므로 이 소비자의 CPU 한도(기본 30초)는 그대로 둔다. DLQ는 파이프라인과 같이 쓴다.
# 큐는 `cf-wrangler.py queues create people-os-doc-jobs`로 만들었다 (2026-11-22).
[[queues.producers]]
binding = "DOC_JOBS"
queue = "people-os-doc-jobs"

[[queues.consumers]]
queue = "people-os-doc-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "people-os-pipeline-dlq"

# 0 22 * * * = 07:00 KST 다이제스트 (C9). 0 18 * * * = 03:00 KST S4 평가 cron
# (비용 동기화 → 표본 판정 → 평가 실행 → 정체 실행 청소). scheduled()가 event.cron으로 분기한다.
# WF-8: "*/15 * * * *" = 워크플로우 스케줄 틱(15분). 18:00·22:00 UTC에도 돌지만 그때는 위 두 크론과 **별개의 scheduled 이벤트**로 들어온다.
[triggers]
crons = ["0 22 * * *", "0 18 * * *", "*/15 * * * *"]

# S4 비용 동기화용 계정 ID (비밀 아님 — vars. AIG_LOGS_TOKEN은 secret으로 별도 설정).

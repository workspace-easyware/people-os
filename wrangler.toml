# 일잇 People OS — wrangler 설정. 배포는 ~/workspace/custom-connectors/custom.cloudflare/bin/cf-wrangler.py deploy 로 (저장된 API 토큰 주입).
name = "people-os"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# 정적 프론트 (public/)
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "people-os-db"
database_id = "5dff997a-fe7b-4f27-9624-1c88e40857c1"
preview_database_id = "36113f26-d305-4bef-963e-92f60a7d0a02" # wrangler dev --remote용 미리보기 DB (배포에는 영향 없음)
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "de4c7ddf4c76495381ba82c56fb23dbb"
preview_id = "b6247fcf1ee2467cbeea51190a0d0413" # wrangler dev --remote용 미리보기 네임스페이스 (배포에는 영향 없음)

[[r2_buckets]]
binding = "FILES"
bucket_name = "people-os-files"
preview_bucket_name = "people-os-dev-preview" # wrangler dev --remote용 미리보기 버킷 (배포에는 영향 없음)

[[vectorize]]
binding = "VECTOR"
index_name = "people-os-index-m3"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

[triggers]
crons = ["0 22 * * *"]

# Turnstile (C7): 사이트 키는 공개 값이라 [vars]에 넣어도 된다.
# 비밀 키는 절대 여기에 넣지 않고 `wrangler secret put TURNSTILE_SECRET` /
# Cloudflare 대시보드(Settings → Variables → Add Secret)에서만 설정한다.
# 키 만드는 법: 대시보드 → Turnstile → Add Site (도메인:
# people-os.workspace-easyware.workers.dev) → Site Key + Secret Key 발급.
# 둘 다 미설정 시 질문 검증은 건너뛴다 (데모 진행용 fail-open).
# [vars]
# TURNSTILE_SITEKEY = "0x..."

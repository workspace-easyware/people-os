# Turnstile (C7): 사이트 키는 공개 값이라 [vars]에 넣어도 된다.
# 비밀 키는 절대 여기에 넣지 않고 `wrangler secret put TURNSTILE_SECRET` /
# Cloudflare 대시보드(Settings → Variables → Add Secret)에서만 설정한다.
# 키 만드는 법: 대시보드 → Turnstile → Add Site (도메인 3개:
# peopleos.site, www.peopleos.site, people-os.workspace-easyware.workers.dev)
# → Site Key + Secret Key 발급. 둘 다 미설정 시 질문 검증은 건너뛴다 (데모 진행용 fail-open).
# [vars]
TURNSTILE_SITEKEY = "0x4AAAAAAGIO_oaHS7s1r41w"

# RealtimeKit (화상회의, 2026-11-19): 앱 ID는 공개 식별자라 [vars]에 넣는다.
# API 토큰은 절대 여기에 넣지 않고 `wrangler secret put RTK_API_TOKEN` /
# Cloudflare 대시보드(Settings → Variables → Add Secret)에서만 설정한다.
RTK_APP_ID = "f0325814-1db2-4c8e-ba6f-18443d12be13"

# Think T1 (2026-11-20): 새로 시작하는 워크플로우 agent 단계의 런타임. "think" = ThinkAgent DO, 그 밖 = 기존 WorkflowAgent(legacy).
# 단계마다 처음 시작할 때 한 번 정해져(D1 workflow_agent_steps) 끝까지 그대로다 — 바꿔 재배포해도 진행 중인 단계는 원래 런타임으로 끝난다.
# T1·T2는 legacy로 배포했다. T3(2026-11-20)에서 think로 전환. 롤백은 "legacy"로 바꿔 재배포 (+ 에이전트 메뉴 숨김) — 계획 5장 P2.
AGENT_RUNTIME = "think"

# 캘린더 C5 (2026-11-22): 일정 알림 메일의 링크 앞부분. 크론에는 요청 출처가 없어 주소를 알 수 없기 때문에 둔다 (비밀 아님).
APP_ORIGIN = "https://peopleos.site"
